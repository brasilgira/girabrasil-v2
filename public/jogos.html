<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogos — Gira-Brasil</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/jogos.css">
<link rel="stylesheet" href="css/gate.css">
<script src="js/auth.js"></script>
<script src="js/gate.js"></script>
<script src="js/jogos.js" defer></script>
<script src="js/jogos-modal.js" defer></script>
<script src="js/jogos-gate.js" defer></script>
</head>
<body class="pagina-jogos">

<header class="header-site">
  <div class="header-inner">
    <a href="index.html" class="logo-site">Gira-Brasil</a>
    <nav class="nav-site">
      <a href="index.html">Início</a>
      <a href="noticias.html">Notícias</a>
      <a href="regioes.html">Regiões</a>
      <a href="jogos.html" class="ativo">Jogos</a>
      <a href="girabot.html">Gira-Bot</a>
      <a href="sobre.html">Sobre</a>
    </nav>
    <div class="header-acoes">
      <a href="login.html" class="link-entrar">Entrar</a>
      <a href="cadastro.html" class="botao botao-primario">Criar conta</a>
    </div>
  </div>
</header>

<section class="secao-jogos">
  <!-- Cada card abaixo é só design + estrutura. A lógica de cada jogo
       fica com os amigos do Iago, que vão plugar um arquivo .js próprio
       usando o atributo data-jogo como gancho (ex: document.querySelector('[data-jogo="quiz-da-floresta"]')).
       Nenhum jogo funciona de verdade ainda — os links "Jogar" são placeholder (#).

       Layout: seletor de modo (estilo "escolha seu jogo"). Um card fica
       expandido (.ativo) por vez; os outros ficam recolhidos, mostrando
       só a imagem e o título. Clicar em um card recolhido o expande
       (ver js/jogos.js). -->
  <div class="seletor-jogos" id="seletorJogos">

    <button type="button" class="jogo-card" data-jogo="quiz-da-floresta" aria-pressed="false">
      <div class="jogo-fundo">
        <img src="assets/jogos/game-quiz.jpg" alt="Ilustração de floresta com pontos de interrogação">
      </div>
      <div class="jogo-titulo-recolhido">Quiz de Espécies</div>
      <div class="jogo-conteudo">
        <div class="jogo-eyebrow">Reconheça animais da fauna brasileira em fotos</div>
        <h3>Quiz de Espécies</h3>
        <div class="jogo-botoes">
          <a href="#" class="botao botao-jogar">Jogar</a>
        </div>
      </div>
    </button>

    <button type="button" class="jogo-card" data-jogo="guardioes-da-amazonia" aria-pressed="false">
      <div class="jogo-fundo">
        <img src="assets/jogos/game-guardioes.jpg" alt="Ilustração de personagens na floresta amazônica">
      </div>
      <div class="jogo-titulo-recolhido">Guarda da Floresta</div>
      <div class="jogo-conteudo">
        <div class="jogo-eyebrow">Destrua as motosserras, poupe os animais</div>
        <h3>Guarda da Floresta</h3>
        <div class="jogo-botoes">
          <a href="#" class="botao botao-jogar">Jogar</a>
        </div>
      </div>
    </button>

    <button type="button" class="jogo-card" data-jogo="desafio-dos-biomas" aria-pressed="false">
      <div class="jogo-fundo">
        <img src="assets/jogos/game-biomas.jpg" alt="Ilustração de paisagem com diferentes biomas brasileiros">
      </div>
      <div class="jogo-titulo-recolhido">Fuga do Desmatamento</div>
      <div class="jogo-conteudo">
        <div class="jogo-eyebrow">Guie a onça-pintada pelos obstáculos da floresta</div>
        <h3>Fuga do Desmatamento</h3>
        <div class="jogo-botoes">
          <a href="#" class="botao botao-jogar">Jogar</a>
        </div>
      </div>
    </button>

    <button type="button" class="jogo-card" data-jogo="missao-biodiversidade" aria-pressed="false">
      <div class="jogo-fundo">
        <img src="assets/jogos/game-biodiversidade.jpg" alt="Ilustração de onça-pintada e tucano na floresta">
      </div>
      <div class="jogo-titulo-recolhido">Defender o Rio</div>
      <div class="jogo-conteudo">
        <div class="jogo-eyebrow">Bloqueie o lixo e o garimpo antes que cheguem ao mar</div>
        <h3>Defender o Rio</h3>
        <div class="jogo-botoes">
          <a href="#" class="botao botao-jogar">Jogar</a>
        </div>
      </div>
    </button>

  </div>
  <p class="sr-only" aria-live="polite">Selecione um jogo</p>
</section>

<!-- ═══════════════════════════════════
     JOGOS — MODAL DE JOGO (canvas)
     Aberto pelos botões "Jogar" de cada card acima.
     ═══════════════════════════════════ -->
<div class="game-overlay" id="game-overlay">

  <!-- Menu de seleção (não é usado pela página jogos.html, que já tem
       seu próprio seletor de cards acima — fica aqui só como parte
       da engine importada, caso venha a ser reaproveitado). -->
  <div class="games-menu" id="games-menu" style="display:none">
    <div class="games-menu-header">
      <div class="games-menu-title">🎮 Jogos da Floresta</div>
      <button class="game-close" id="btn-close-games">✕</button>
    </div>
    <div class="games-grid" id="gamesGrid"></div>
  </div>

  <div class="game-panel" id="game-panel" style="display:none">
    <div class="game-header">
      <button class="btn-back" id="btn-back">← Jogos</button>
      <div class="game-title" id="game-title">—</div>
      <button class="game-close" id="btn-close-game">✕</button>
    </div>
    <div class="game-hud" id="game-hud">
      <span class="hud-score">Pontos: <strong id="score-val">0</strong></span>
      <span class="hud-level" id="hud-level-wrap">Nível <strong id="level-val">1</strong></span>
      <span class="hud-lives" id="hud-lives-wrap">Vidas: <strong id="lives-val">❤️❤️❤️</strong></span>
    </div>
    <div class="game-canvas-wrap" id="game-canvas-wrap">
      <canvas id="game-canvas" width="960" height="500"></canvas>
      <div class="game-screen" id="game-screen">
        <h2 id="game-screen-title"></h2>
        <p id="game-screen-desc"></p>
        <button class="btn-start-game" id="btn-start-game">Começar!</button>
      </div>
    </div>
    <p class="game-tip" id="game-tip"></p>
  </div>

</div>

</body>
</html>
